// Outperform Institute Diagnostic — Secure API Handler v2
// Netlify Function: /netlify/functions/api
// All API keys live in Netlify environment variables — never in the browser

const AIRTABLE_BASE_ID   = process.env.AIRTABLE_BASE_ID;
const AIRTABLE_API_KEY   = process.env.AIRTABLE_API_KEY;
const ANTHROPIC_API_KEY  = process.env.ANTHROPIC_API_KEY;
const GHL_WEBHOOK_URL    = process.env.GHL_WEBHOOK_URL;
const GHL_API_KEY        = process.env.GHL_API_KEY;
const GHL_LOCATION_ID    = process.env.GHL_LOCATION_ID;

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'POST, OPTIONS',
  'Access-Control-Allow-Headers': 'Content-Type',
};

exports.handler = async (event) => {
  if (event.httpMethod === 'OPTIONS') {
    return { statusCode: 204, headers: CORS, body: '' };
  }
  if (event.httpMethod !== 'POST') {
    return { statusCode: 405, headers: CORS, body: 'Method not allowed' };
  }

  let body;
  try { body = JSON.parse(event.body); }
  catch { return json(400, { error: 'Invalid JSON' }); }

  switch (body.action) {
    case 'save':           return handleSave(body);
    case 'ghl_webhook':    return handleGHLWebhook(body);
    case 'ghl_upload_pdf': return handleGHLPDFUpload(body);
    case 'narrative':      return handleNarrative(body);
    default:               return json(400, { error: 'Unknown action' });
  }
};

// ── SAVE TO AIRTABLE ─────────────────────────────────────────────
async function handleSave({ fields }) {
  if (!fields?.Email) return json(400, { error: 'Email required' });
  try {
    const res = await fetch(
      `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Diagnostic%20Responses`,
      {
        method: 'POST',
        headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields, typecast: true }),
      }
    );
    const data = await res.json();
    if (!res.ok) return json(502, { error: 'Airtable error', detail: data });
    return json(200, { success: true, recordId: data.id });
  } catch (e) {
    return json(500, { error: e.message });
  }
}

// ── GHL WEBHOOK (Action A + B) ───────────────────────────────────
async function handleGHLWebhook({ payload }) {
  const webhookUrl = GHL_WEBHOOK_URL ||
    'https://services.leadconnectorhq.com/hooks/Ij1AeSf44iidSOUYTiDZ/webhook-trigger/b648dbab-568e-407f-b525-00123696961a';

  try {
    const res = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    return json(200, { success: true, ghl_response: text });
  } catch (e) {
    return json(500, { error: e.message });
  }
}

// ── GHL PDF UPLOAD TO CONTACT ────────────────────────────────────
async function handleGHLPDFUpload({ email, pdfBase64, fileName, contactId }) {
  if (!GHL_API_KEY || !GHL_LOCATION_ID) {
    return json(200, { success: false, reason: 'GHL API not configured' });
  }

  try {
    // Step 1: Find contact by email if no contactId provided
    let resolvedContactId = contactId;
    if (!resolvedContactId && email) {
      const searchRes = await fetch(
        `https://services.leadconnectorhq.com/contacts/?email=${encodeURIComponent(email)}&locationId=${GHL_LOCATION_ID}`,
        {
          headers: {
            Authorization: `Bearer ${GHL_API_KEY}`,
            Version: '2021-07-28',
          },
        }
      );
      const searchData = await searchRes.json();
      const contacts = searchData?.contacts || [];
      if (contacts.length > 0) {
        resolvedContactId = contacts[0].id;
      }
    }

    if (!resolvedContactId) {
      return json(200, { success: false, reason: 'Contact not found in GHL' });
    }

    // Step 2: Upload PDF to GHL Media Library
    const boundary = '----FormBoundary' + Math.random().toString(36).slice(2);
    const pdfBuffer = Buffer.from(pdfBase64, 'base64');

    // Build multipart form data
    const formParts = [
      `--${boundary}\r\nContent-Disposition: form-data; name="file"; filename="${fileName}"\r\nContent-Type: application/pdf\r\n\r\n`,
      pdfBuffer,
      `\r\n--${boundary}\r\nContent-Disposition: form-data; name="locationId"\r\n\r\n${GHL_LOCATION_ID}`,
      `\r\n--${boundary}\r\nContent-Disposition: form-data; name="contactId"\r\n\r\n${resolvedContactId}`,
      `\r\n--${boundary}--`,
    ];

    const bodyParts = formParts.map(p => typeof p === 'string' ? Buffer.from(p) : p);
    const bodyBuffer = Buffer.concat(bodyParts);

    const uploadRes = await fetch(
      `https://services.leadconnectorhq.com/medias/upload-file`,
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${GHL_API_KEY}`,
          Version: '2021-07-28',
          'Content-Type': `multipart/form-data; boundary=${boundary}`,
          'Content-Length': bodyBuffer.length,
        },
        body: bodyBuffer,
      }
    );

    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) {
      return json(502, { error: 'GHL upload failed', detail: uploadData });
    }

    return json(200, { success: true, fileId: uploadData.fileId || uploadData.id });
  } catch (e) {
    return json(500, { error: e.message });
  }
}

// ── CLAUDE NARRATIVE ─────────────────────────────────────────────
async function handleNarrative({ contactData, pillarScores, overall, scores, pillars }) {
  const scoreDetails = pillars.map((p, i) => {
    const qLines = p.questions.map(q => {
      const raw = scores[`${p.id}_${q.id}`] || 3;
      return `    - ${q.label}: ${raw}/5 (scaled: ${(raw*2).toFixed(1)}/10)`;
    }).join('\n');
    return `${p.name} (${pillarScores[i].toFixed(1)}/10, weight ${Math.round(p.weight*100)}%):\n${qLines}`;
  }).join('\n\n');

  const prompt = buildPrompt(contactData, pillarScores, overall, scoreDetails);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5-20251022',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    const data = await res.json();
    if (!res.ok) return json(502, { error: 'Claude error', detail: data });
    return json(200, { success: true, narrative: data.content[0].text });
  } catch (e) {
    return json(500, { error: e.message });
  }
}

// ── PROMPT ───────────────────────────────────────────────────────
function buildPrompt(c, pillarScores, overall, scoreDetails) {
  return `You are a senior sales performance advisor at Outperform Institute. Write a direct, practitioner-to-practitioner diagnostic narrative for this sales leader. No hedging. Call out what the scores actually mean.

RESPONDENT: ${c.firstName} ${c.lastName}, ${c.title} at ${c.company}
Team: ${c.teamSize} reps | ARR: ${c.arr} | Industry: ${c.industry}

OVERALL SCORE: ${overall.toFixed(1)}/10

${scoreDetails}

PILLAR WEIGHTS: Control 25%, Define/Shape/Enlighten 20% each, Excite 15%

Write five sections with ALL CAPS headers:

EXECUTIVE SUMMARY (2-3 sentences): What does ${overall.toFixed(1)} mean for ${c.company}? Systems or heroics?

WHERE THE WEIGHT IS (3-4 sentences): Which 1-2 pillars are creating the most drag? Name downstream business consequences.

STRUCTURAL PATTERN: Name the archetype this organization fits.

THE LOAD-BEARING REPAIRS (3-4 sentences): Top 2-3 highest-leverage fixes, sequenced.

THE HONEST CLOSE (2 sentences): Direct statement. Actionable, not discouraging.

Tone: Direct operator. Short sentences. Strong verbs. No "moreover", "furthermore", "essentially", "basically", "delve".`;
}

function json(status, data) {
  return { statusCode: status, headers: { ...CORS, 'Content-Type': 'application/json' }, body: JSON.stringify(data) };
}
